<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>News Landscape — Amplifier Research</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,system-ui,sans-serif}
#controls{padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid #21262d}
#controls select,#controls input[type=date]{background:#161b22;color:#e6edf3;border:1px solid #30363d;
  padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer}
#controls select:hover,#controls input[type=date]:hover{border-color:#58a6ff}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.8)}
.lbl{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.sep{color:#30363d;font-size:14px}
#stats{margin-left:auto;font-size:13px;color:#8b949e}
#chart{width:100vw;height:calc(100vh - 46px)}
#rankings{display:none;width:100vw;height:calc(100vh - 46px);overflow-y:auto;padding:20px}
#rank-table{width:100%;border-collapse:collapse;font-size:13px}
#rank-table th{padding:8px 10px;text-align:left;border-bottom:2px solid #30363d;
  position:sticky;top:0;background:#0d1117;cursor:pointer;user-select:none}
#rank-table th:hover{color:#58a6ff}
#rank-table td{padding:6px 10px}
#rank-table tr:hover{background:#1c2128}
#rank-table tr{border-bottom:1px solid #21262d;cursor:pointer}
#sidebar{display:none;position:fixed;right:0;top:0;width:420px;height:100vh;
  background:#161b22;border-left:1px solid #30363d;overflow-y:auto;z-index:1000;
  box-shadow:-4px 0 20px rgba(0,0,0,0.4)}
#sb-head{padding:16px;border-bottom:1px solid #21262d;display:flex;
  justify-content:space-between;align-items:flex-start}
#sb-title{font-size:15px;font-weight:600;margin:0;flex:1}
#sb-close{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer;
  padding:0 0 0 12px;line-height:1}
#sb-close:hover{color:#e6edf3}
#sb-meta{padding:8px 16px;font-size:12px;color:#8b949e;border-bottom:1px solid #21262d}
.post-card{padding:12px 16px;border-bottom:1px solid #21262d}
.post-card:hover{background:#1c2128}
.pc-top{display:flex;justify-content:space-between;font-size:13px}
.pc-acct{color:#58a6ff;font-weight:500}
.pc-date{color:#8b949e;font-size:12px}
.pc-cap{margin:4px 0;color:#c9d1d9;font-size:13px;line-height:1.4}
.pc-stats{display:flex;gap:14px;font-size:12px;color:#8b949e}
.pc-stats a{color:#58a6ff;text-decoration:none}
.pc-stats a:hover{text-decoration:underline}
#trending{display:none;width:100vw;height:calc(100vh - 46px);overflow-y:auto;padding:20px}
#trend-table{width:100%;border-collapse:collapse;font-size:13px}
#trend-table th{padding:8px 10px;text-align:left;border-bottom:2px solid #30363d;
  position:sticky;top:0;background:#0d1117}
#trend-table td{padding:6px 10px}
#trend-table tr:hover{background:#1c2128}
#trend-table tr{border-bottom:1px solid #21262d;cursor:pointer}
.window-badge{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.window-green{background:#3fb950}
.window-yellow{background:#d29922}
.window-red{background:#f85149}
.window-gray{background:#484f58}
#sb-timeline{padding:12px 16px;border-bottom:1px solid #21262d}
#sb-timeline svg{display:block}
.tl-label{font-size:10px;fill:#8b949e}
.tl-window{fill:rgba(63,185,80,0.08);stroke:rgba(63,185,80,0.3);stroke-width:1}
#acct-profile{display:none;padding:6px 20px 10px;border-bottom:1px solid #21262d;max-height:220px;overflow-y:auto}
#acct-profile h4{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.prof-bar{display:flex;align-items:center;margin:2px 0;font-size:12px;height:18px}
.prof-bar-label{width:120px;color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.prof-bar-fill{height:12px;border-radius:2px;min-width:2px}
.prof-bar-val{margin-left:6px;color:#8b949e;white-space:nowrap}
</style>
</head>
<body>
<div id="controls">
  <span class="lbl">View</span>
  <select id="vf">
    <option value="map">Map</option>
    <option value="rank">Rankings</option>
    <option value="trend">Trending</option>
  </select>
  <span class="sep">|</span>
  <span class="lbl">Time</span>
  <select id="tf">
    <option value="0">All time</option>
    <option value="1">Last 24h</option>
    <option value="3">Last 3 days</option>
    <option value="7">Last 7 days</option>
    <option value="30" selected>Last 30 days</option>
    <option value="90">Last 90 days</option>
    <option value="365">Last year</option>
    <option value="custom">Custom range</option>
  </select>
  <input type="date" id="d0" style="display:none" title="From">
  <span class="sep" id="dsep" style="display:none">&rarr;</span>
  <input type="date" id="d1" style="display:none" title="To">
  <span class="lbl">Source</span>
  <select id="af">
    <option value="">All accounts</option>
  </select>
  <span class="lbl">Color</span>
  <select id="cf">
    <option value="rate">Engagement Rate</option>
    <option value="raw">Raw Engagement</option>
  </select>
  <span id="stats"></span>
</div>
<div id="acct-profile"></div>
<div id="chart"></div>
<div id="rankings">
  <table id="rank-table">
    <thead><tr>
      <th data-sort="rank">#</th>
      <th data-sort="label">Story</th>
      <th data-sort="cat">Category</th>
      <th data-sort="n">Posts</th>
      <th data-sort="na">Accounts</th>
      <th data-sort="lk">Total Likes &darr;</th>
      <th data-sort="rate">Eng Rate</th>
    </tr></thead>
    <tbody id="rank-body"></tbody>
  </table>
</div>
<div id="trending">
  <table id="trend-table">
    <thead><tr>
      <th>Window</th>
      <th>Story</th>
      <th>Category</th>
      <th>Started</th>
      <th>Posts / Accts</th>
      <th>Velocity</th>
      <th>Mult</th>
      <th>Likes</th>
      <th>Eng Rate</th>
    </tr></thead>
    <tbody id="trend-body"></tbody>
  </table>
</div>
<div id="sidebar">
  <div id="sb-head">
    <h3 id="sb-title"></h3>
    <button id="sb-close">&times;</button>
  </div>
  <div id="sb-meta"></div>
  <div id="sb-timeline"></div>
  <div id="sb-posts"></div>
</div>
<script src="data-p0.js"></script>
<script src="data-p1.js"></script>
<script src="data-p2.js"></script>
<script src="data-p3.js"></script>
<script src="data-p4.js"></script>
<script src="data-s.js"></script>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script src="app.js"></script>
</body>
</html>
